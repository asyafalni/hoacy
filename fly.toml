# Fly.io — the static site, served by nginx (Dockerfile, nginx.conf).
# docs/deploy.md
app = "iuran-cypress"
primary_region = "sin"   # Singapore — the closest Fly region to Indonesia

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle; the first visit after that wakes it in a second or two.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
