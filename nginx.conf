# Serves the built site (dist/) on :8080 for Fly.io — docs/deploy.md.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Hashed build output never changes under the same name — cache it for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # The app shell and the PWA service worker must always be revalidated, or a
  # phone keeps running the old version after a deploy.
  # nginx's built-in MIME map has no .webmanifest; with nosniff a browser would
  # refuse the PWA manifest served as application/octet-stream.
  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }

  location ~* ^/(index\.html|sw\.js|registerSW\.js|workbox-.*\.js)$ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Hash routing (#/pos, #/kas…) means every page is index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
